<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Compras</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Lista de Compras</h1>

    <div class="content">

        <div class="content--add-item">

            <input
                type="text"
                id="input-name-item"
                placeholder="Digite o nome do item"
            >

            <button onclick="novoItem()" id="btn-novo-item">
                Adicionar
            </button>

        </div>

        <div class="content--counter">

            <p>Total: <span id="contador-total">0</span></p>
            <p>Comprados: <span id="contador-comprados">0</span></p>
            <p>Pendentes: <span id="contador-pendentes">0</span></p>

        </div>

        <div class="content--body">

            <ol id="lista-compras"></ol>

        </div>

    </div>

    <script src="back.js"></script>

</body>

</html>
